services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"   # Jenkins Web UI
      - "50000:50000" # Agent communication
    volumes:
      # Named volume for persistent Jenkins data
      - jenkins_home:/var/jenkins_home
      
      # Bind mount to allow Jenkins to run Docker commands
      # On Windows, Docker Desktop maps this automatically
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
  # Defining the volume here as a mapping (not a list)
  # ensures your data persists even if the container is deleted.
